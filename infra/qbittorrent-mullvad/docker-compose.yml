# qBittorrent behind Mullvad (WireGuard) via gluetun.
#
# qBittorrent has NO network stack of its own — it shares gluetun's network
# namespace. If the tunnel drops, gluetun's firewall drops with it and
# qBittorrent has nowhere to send packets. There is no leak path, including
# during container restarts, because the namespace itself is the killswitch.
#
#   docker compose up -d
#   docker compose logs -f gluetun          # confirm the tunnel came up
#   docker compose exec gluetun wget -qO- https://am.i.mullvad.net/connected

services:
  gluetun:
    image: qmcgaw/gluetun:v3
    container_name: gluetun
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      # Every port qBittorrent needs is published HERE, not on the qbittorrent
      # service — qbittorrent has no network namespace to publish from.
      - "8080:8080"          # qBittorrent WebUI
      - "6881:6881/tcp"      # BitTorrent (see PORT FORWARDING note in README)
      - "6881:6881/udp"
    volumes:
      - ./gluetun:/gluetun
    environment:
      VPN_SERVICE_PROVIDER: mullvad
      VPN_TYPE: wireguard

      # From your Mullvad WireGuard config file. See README for how to get it.
      WIREGUARD_PRIVATE_KEY: ${WIREGUARD_PRIVATE_KEY:?set in .env}
      WIREGUARD_ADDRESSES: ${WIREGUARD_ADDRESSES:?set in .env}

      # Server selection. Pick ONE approach:
      SERVER_CITIES: ${SERVER_CITIES:-Amsterdam}
      # SERVER_COUNTRIES: Netherlands
      # SERVER_HOSTNAMES: nl-ams-wg-001
      # OWNED_ONLY: "yes"        # only Mullvad-owned servers, not rented

      # Encrypted DNS through the tunnel, with a local cache.
      # gluetun renamed these: DOT -> DNS_SERVER, DOT_PROVIDERS ->
      # DNS_UPSTREAM_RESOLVERS, and the protocol split out into its own var.
      # Resolvers are provider NAMES here, not URLs (cloudflare, quad9,
      # google, opendns, cleanbrowsing security, ...).
      DNS_SERVER: "on"
      DNS_UPSTREAM_RESOLVER_TYPE: dot
      DNS_UPSTREAM_RESOLVERS: cloudflare
      DNS_CACHING: "on"
      DNS_KEEP_NAMESERVER: "off"
      BLOCK_MALICIOUS: "on"

      # Let the LAN reach the WebUI without going through the tunnel.
      # MUST match your actual LAN subnet or the WebUI will be unreachable.
      FIREWALL_OUTBOUND_SUBNETS: ${LAN_SUBNET:-192.168.1.0/24}

      # Reconnecting on a dead tunnel is built-in as of v3.41 — the old
      # HEALTH_VPN_DURATION_* vars are obsolete and were removed from here.

      # If the tunnel connects but passes no traffic, try forcing the
      # userspace WireGuard implementation. The kernel module in a container
      # silently drops packets on some host/kernel combinations.
      # WIREGUARD_IMPLEMENTATION: userspace

      TZ: ${TZ:-Etc/UTC}
    healthcheck:
      test: ["CMD", "/gluetun-entrypoint", "healthcheck"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    # THE important line. No ports:, no networks: — it lives inside gluetun.
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
      WEBUI_PORT: 8080
      TORRENTING_PORT: 6881
    volumes:
      - ./qbittorrent:/config
      # Downloads. Points at the ZFS dataset from the raidz3 setup.
      # Keep incomplete/ and complete/ on the SAME dataset so finished
      # torrents are moved by rename, not copied across filesystems.
      - ${DOWNLOADS_PATH:-/tank/torrents}:/downloads
